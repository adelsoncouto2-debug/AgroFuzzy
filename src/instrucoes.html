<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/instrucoes.css" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <div class="main-title">
        <span>Instruções de uso do sistema</span>
      </div>
      <div class="card">
        <p>1-Conecte-se à nossa rede-Wifi pelo arduino</p>
        <p>2-Escolha o tipo de cultura que deseja plantar</p>
        <p>3-Coloque os sensores na terra</p>
      </div>
      <div class="image-row">
        <div class="image-wrap">
          <img
            class="main-image"
            src="./image/image-removebg-preview.png"
            alt="Ilustração do sistema AgroFuzzy"
          />
          <a
            class="arrow-link"
            href="../index.html"
            aria-label="Voltar ao início"
          >
            <svg
              class="arrow"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </a>
        </div>
      </div>
    </main>
    <script>
      const pagina = document.querySelector(".arrow-link");
      pagina.addEventListener("click", function (event) {
        window.location.href = "/src/escolha.html";
      });
    </script>
  </body>
</html>
